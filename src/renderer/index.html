<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:;  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:">
<title>REPRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link id="themeCss" rel="stylesheet" href="../../themes/billet/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-mode="desktop" data-theme="billet" data-ui="desk">

<div class="top">
  <div class="wordmark">REP<b>RO</b></div>
  <div class="seg" id="modeSeg">
    <button data-m="desktop" class="on">Desktop</button>
    <button data-m="couch">Couch</button>
  </div>
  <div class="seg ui" id="uiSeg">
    <button data-u="desk" class="on">Desk</button>
    <button data-u="tv">TV</button>
  </div>
  <label class="search">⌕ <input id="q" placeholder="search…"><kbd>/</kbd></label>
  <div class="spacer"></div>
  <div class="themes"><span>theme</span><span id="themeSwatches"></span></div>
  <button class="icon" id="btnAdd" title="add folder">+</button>
  <button class="icon" id="btnRescan" title="rescan">↻</button>
  <button class="icon" id="btnSetup" title="setup">⚙</button>
</div>

<div class="desk">
  <nav class="side" id="side"></nav>
  <section class="main">
    <h2 id="title">All games</h2>
    <div class="sub" id="sub"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="detail" id="detail"><div class="empty">pick a game</div></aside>
</div>

<div class="couch" id="couch">
  <div class="bgart" id="bgA"></div><div class="bgart" id="bgB"></div>
  <div class="fade"></div>
  <div class="chero" id="hero"></div>
  <div class="rows" id="rows"><div class="inner" id="inner"></div></div>
  <div class="hud">
    <span><span class="b">A</span>play</span>
    <span><span class="b">Y</span>favorite</span>
    <span><span class="b">X</span>random</span>
    <span><span class="b">▤</span>desktop</span>
    <span class="now" id="clock"></span>
  </div>
</div>

<div class="ov" id="ov"></div>
<div class="setup" id="setup"></div>
<div class="drop">drop it here<small>a rom folder or an emulator exe. REPRO figures out what it is.</small></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
