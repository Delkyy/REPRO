<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:">
<title>REPRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link id="themeCss" rel="stylesheet" href="../../themes/billet/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-theme="billet">

  <nav class="rail" id="rail">
    <button class="on" data-f="all" title="Library">▦</button>
    <button data-f="recent" title="Continue">▶</button>
    <button data-f="fav" title="Favorites">★</button>
    <span class="sp"></span>
    <button id="railAdd" title="Add anything (Ctrl+O)">+</button>
    <button id="railSettings" title="Settings">⚙</button>
  </nav>

  <aside class="side" id="side"></aside>

  <div class="top">
    <button class="icon" id="tSide" title="Toggle sidebar (Ctrl+E)">☰</button>
    <label class="search">⌕ <input id="q" placeholder="search…"><kbd>Ctrl F</kbd></label>
    <div class="seg" id="viewSeg">
      <button class="on" data-v="grid" title="grid">▦</button>
      <button data-v="list" title="list">☰</button>
    </div>
    <input type="range" min="110" max="220" value="150" id="zoom" style="width:80px" title="card size">
    <span class="count" id="count"></span>
    <button class="icon junk" id="tJunk" title="hide junk">⊘</button>
    <button class="icon" id="tDetail" title="Toggle details (Ctrl+G)">▥</button>
    <button class="icon couch" id="btnCouch" title="Couch mode (Ctrl+2)"><i class="lg" id="brandLg"></i> Couch</button>
  </div>

  <main class="main" id="main"></main>

  <aside class="detail" id="detail"></aside>

  <div class="couchwrap" id="couchwrap">
    <div class="bgart" id="bgA"></div><div class="bgart" id="bgB"></div>
    <div class="cskin" id="cskin"></div>
    <div class="cfade"></div>
    <div class="chero" id="chero"></div>
    <div class="crows" id="crows"><div class="inner" id="cinner"></div></div>
    <div class="chud">
      <span><span class="b">A</span>play</span>
      <span><span class="b">Y</span>favorite</span>
      <span><span class="b">X</span>random</span>
      <span><span class="b">▤</span>desktop</span>
      <span class="now" id="clock"></span>
    </div>
  </div>
</div>

<div class="cov" id="cov"></div>
<div class="guide" id="guide"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
