<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REPRO — sketch 001</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ---------- theme tokens: this block IS a theme file ---------- */
:root, [data-theme="slate"] {
  --bg:#0e1014; --bg2:#151821; --panel:#1b1f2a; --line:#262b38;
  --fg:#e7eaf0; --muted:#8a91a3; --accent:#ff4d4d; --accent2:#ffb02e;
  --radius:10px; --font:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
  --card-glow:0 0 0 3px var(--accent), 0 18px 40px rgba(0,0,0,.6);
}
[data-theme="crt"] {
  --bg:#050806; --bg2:#0a120c; --panel:#0d1a10; --line:#173a20;
  --fg:#c9ffd0; --muted:#5fa66a; --accent:#39ff6a; --accent2:#ffe45c;
  --radius:2px; --font:"JetBrains Mono",monospace; --mono:"JetBrains Mono",monospace;
  --card-glow:0 0 0 2px var(--accent), 0 0 30px rgba(57,255,106,.35);
}
[data-theme="paper"] {
  --bg:#f3efe6; --bg2:#ece6d8; --panel:#fffdf7; --line:#d9d1bf;
  --fg:#1d1a14; --muted:#7a7263; --accent:#c8321f; --accent2:#e58f1f;
  --radius:14px; --font:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",monospace;
  --card-glow:0 0 0 3px var(--accent), 0 14px 30px rgba(60,40,10,.25);
}
[data-theme="crt"] body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:99}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s,color .3s;--u:1}
body[data-ui="tv"]{--u:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* ---------- top bar ---------- */
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg2);min-width:0}
.wordmark{font-weight:800;letter-spacing:.18em;font-size:18px;flex:none}
.wordmark b{color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.seg.ui{display:none}
body[data-mode="couch"] .seg.ui{display:flex}
.search{flex:1 1 120px;min-width:0;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.search input{background:none;border:0;color:var(--fg);outline:0;flex:1;min-width:0;font:inherit}
.spacer{flex:1}
.themes{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);flex:none}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.swatch.on{border-color:var(--fg)}
.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);font-size:16px;flex:none}
.icon:hover{color:var(--fg);border-color:var(--fg)}
kbd{font-family:var(--mono);font-size:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
@media (max-width:760px){ .themes span, .search kbd, .search .ph{display:none} }

/* ---------- desktop layout ---------- */
.desk{display:none;height:calc(100% - 56px)}
body[data-mode="desktop"] .desk{display:grid;grid-template-columns:220px minmax(0,1fr) 340px}
.side{border-right:1px solid var(--line);padding:16px 10px;background:var(--bg2);overflow:auto}
.side h4{font-size:10px;letter-spacing:.14em;color:var(--muted);padding:12px 10px 6px;text-transform:uppercase}
.side button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.side button .n{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.7}
.side button .ico{display:none;font-family:var(--mono);font-size:10px;font-weight:600;width:28px;height:28px;border-radius:7px;place-items:center;border:1px solid var(--line)}
.side button:hover{background:var(--panel);color:var(--fg)}
.side button.on{background:var(--panel);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.side .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.side .dot.ok{background:#3ddc84}.side .dot.warn{background:var(--accent2)}
.main{overflow:auto;padding:20px 24px;min-width:0}
.main h2{font-size:22px;font-weight:800;margin-bottom:4px}
.main .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}
.card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--panel);aspect-ratio:3/4.2;cursor:pointer;transition:transform .12s,box-shadow .12s;border:1px solid var(--line)}
.card img{width:100%;height:100%;object-fit:cover}
.card:hover,.card.sel{transform:translateY(-3px);box-shadow:var(--card-glow)}
.card .noart{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 12px 30px;font-weight:600;font-size:13px;line-height:1.2;background:linear-gradient(160deg,var(--bg2),var(--panel))}
.card .noart small{color:var(--muted);font-weight:500;margin-top:4px;font-size:11px}
.card .tag{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff}
.card .fav{position:absolute;top:6px;right:8px;color:var(--accent2);font-size:14px;text-shadow:0 1px 3px #000}
.card .pt{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;font-size:10px;font-family:var(--mono);background:linear-gradient(transparent,rgba(0,0,0,.85));color:#ddd}
.detail{border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:0;position:relative}
.detail .close{display:none;position:absolute;top:10px;right:10px;z-index:3}
.detail .hero{aspect-ratio:3/2;background:var(--panel);overflow:hidden;position:relative}
.detail .hero img{width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.5);transform:scale(1.2)}
.detail .hero .cover{position:absolute;left:18px;bottom:-40px;width:110px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;background:var(--panel)}
.detail .hero .cover img{filter:none;transform:none;aspect-ratio:3/4.2;object-fit:cover}
.detail .body{padding:52px 18px 18px}
.detail h3{font-size:18px;font-weight:800;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:8px 0 14px;font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;width:100%;justify-content:center;font-size:15px;padding:12px}
.btn.primary:hover{filter:brightness(1.1)}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{flex:1;justify-content:center;font-size:12px;padding:8px}
.sect{margin-top:20px}
.sect h5{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center}
.sect h5 a{margin-left:auto;color:var(--accent);font-size:11px;letter-spacing:0;text-transform:none;cursor:pointer}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;font-size:12px;background:var(--panel)}
.slot .sh{width:44px;height:30px;border-radius:4px;background:linear-gradient(135deg,#3a4a7a,#1f2b4d);flex:none}
.slot .t{flex:1;line-height:1.2;min-width:0}
.slot .t small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;margin-top:2px}
.slot .act{opacity:0;display:flex;gap:4px}
.slot:hover .act{opacity:1}
.slot .act button{padding:3px 7px;border:1px solid var(--line);border-radius:5px;font-size:11px}
.slot .act button:hover{border-color:var(--fg)}
.slot.auto .sh{background:linear-gradient(135deg,#555,#333)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;font-size:12px}
.kv span{color:var(--muted)}
.kv select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px;max-width:100%}
.kv code{font-family:var(--mono);font-size:11px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:40px;text-align:center}

/* narrow desktop: sidebar to icons, detail to slide-over */
@media (max-width:1100px){
  body[data-mode="desktop"] .desk{grid-template-columns:60px minmax(0,1fr) 320px}
  .side{padding:12px 8px}
  .side h4{font-size:0;padding:8px 0;border-top:1px solid var(--line);margin:4px 0}
  .side button{justify-content:center;padding:6px 0}
  .side button .txt,.side button .n,.side button .dot{display:none}
  .side button .ico{display:grid}
  .side button.on .ico{border-color:var(--accent);color:var(--fg)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
}
@media (max-width:900px){
  body[data-mode="desktop"] .desk{grid-template-columns:60px minmax(0,1fr)}
  .detail{position:fixed;top:56px;right:0;bottom:0;width:min(360px,92vw);transform:translateX(100%);transition:transform .25s;z-index:10;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
  .detail.open{transform:none}
  .detail .close{display:grid}
  .main{padding:16px}
}

/* ---------- couch layout (netflix rows + hero) ---------- */
.couch{display:none;position:absolute;inset:0;overflow:hidden}
body[data-mode="couch"] .couch{display:block}
body[data-mode="couch"] .top{position:absolute;width:100%;z-index:5;background:linear-gradient(var(--bg),transparent);border:0}
.bgart{position:absolute;inset:-60px;background-size:cover;background-position:center 30%;filter:blur(38px) brightness(.32) saturate(1.3);transform:scale(1.08);opacity:0;transition:opacity .6s}
.bgart.on{opacity:1}
[data-theme="paper"] .bgart{filter:blur(38px) brightness(1.1) saturate(.6) opacity(.5)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 55%),linear-gradient(0deg,var(--bg) 0%,rgba(0,0,0,0) 50%);pointer-events:none}
[data-theme="paper"] .fade{background:linear-gradient(0deg,var(--bg) 0%,transparent 50%)}
.hero{position:absolute;left:calc(48px*var(--u));top:clamp(70px,14vh,calc(120px*var(--u)));width:min(58%,calc(760px*var(--u)));z-index:2;pointer-events:none}
.hero .sys{font-family:var(--mono);font-size:calc(12px*var(--u));letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.hero h1{font-size:clamp(26px,calc(3.4vw*var(--u)),calc(56px*var(--u)));font-weight:800;line-height:1.02;margin:calc(8px*var(--u)) 0;text-wrap:balance}
.hero .meta{font-size:calc(13px*var(--u));margin:0;color:var(--muted)}
.hero .desc{font-size:calc(14px*var(--u));color:var(--muted);line-height:1.5;margin-top:calc(10px*var(--u));max-width:52ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .hint{display:flex;flex-wrap:wrap;gap:calc(10px*var(--u));margin-top:calc(18px*var(--u))}
.hero .hint span{display:inline-flex;align-items:center;gap:8px;padding:calc(9px*var(--u)) calc(16px*var(--u));border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-weight:700;font-size:calc(13px*var(--u));backdrop-filter:blur(6px)}
[data-theme="paper"] .hero .hint span{background:rgba(255,255,255,.6)}
.hero .hint span.p{background:var(--accent);border-color:transparent;color:#fff}
.hero.swap{animation:heroin .3s ease-out}
@keyframes heroin{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.rows{position:absolute;left:0;right:0;top:max(46vh,calc(300px*var(--u)));bottom:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 calc(28px*var(--u)),#000 100%);mask-image:linear-gradient(180deg,transparent 0,#000 calc(28px*var(--u)),#000 100%)}
.rows .inner{transition:transform .4s cubic-bezier(.2,.8,.2,1);will-change:transform;padding-top:calc(30px*var(--u))}
.crow{margin-bottom:calc(18px*var(--u));transition:opacity .3s}
.crow.dim{opacity:.35}
.crow.gone{opacity:0}
.crow h3{font-size:calc(13px*var(--u));letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 calc(48px*var(--u));margin-bottom:calc(6px*var(--u));display:flex;gap:10px;align-items:baseline}
.crow h3 b{color:var(--fg);font-weight:800;letter-spacing:.04em;text-transform:none;font-size:calc(18px*var(--u))}
.crow .strip{display:flex;gap:calc(14px*var(--u));padding:calc(12px*var(--u)) calc(48px*var(--u));transition:transform .4s cubic-bezier(.2,.8,.2,1);will-change:transform;width:max-content}
.tile{flex:none;width:clamp(96px,calc(11vh*var(--u)*1.3),calc(190px*var(--u)));aspect-ratio:3/4.2;border-radius:var(--radius);overflow:hidden;background:var(--panel);border:1px solid var(--line);position:relative;transition:transform .2s,box-shadow .2s;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.focus{transform:scale(1.12);box-shadow:var(--card-glow);z-index:2}
.tile .noart{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(12px*var(--u));font-weight:700;font-size:calc(13px*var(--u));line-height:1.15;background:linear-gradient(160deg,var(--bg2),var(--panel))}
.tile .noart small{color:var(--muted);font-weight:500;font-size:calc(10px*var(--u));margin-top:4px}
.tile .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.tile .prog i{display:block;height:100%;background:var(--accent)}
.tile.add{display:grid;place-items:center;color:var(--muted);font-size:calc(40px*var(--u));border-style:dashed}
.hud{position:absolute;bottom:0;left:0;right:0;padding:calc(12px*var(--u)) calc(48px*var(--u));display:flex;flex-wrap:wrap;gap:calc(18px*var(--u));font-size:calc(12px*var(--u));color:var(--muted);background:linear-gradient(transparent,var(--bg) 60%);z-index:5;pointer-events:none}
.hud .b{display:inline-grid;place-items:center;width:calc(20px*var(--u));height:calc(20px*var(--u));border-radius:50%;border:2px solid var(--muted);font-weight:800;font-size:calc(10px*var(--u));margin-right:6px;color:var(--fg)}
body[data-mode="desktop"] .hud{display:none}
.hud .now{margin-left:auto;font-family:var(--mono)}
@media (max-width:700px){ .hero{width:80%} .crow h3,.crow .strip,.hero,.hud{padding-left:20px} .hero{left:0} .hero .desc{display:none} }

/* ---------- couch overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:none;z-index:20;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.ov .box{width:min(calc(980px*var(--u)),100%);max-height:100%;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:min(30%,calc(260px*var(--u))) minmax(0,1fr)}
.ov .box img.big{width:100%;aspect-ratio:3/4.2;object-fit:cover}
.ov .noart{aspect-ratio:3/4.2;display:grid;place-items:center;color:var(--muted);background:var(--panel)}
.ov .body{padding:calc(28px*var(--u));min-width:0}
.ov h2{font-size:calc(30px*var(--u));font-weight:800;line-height:1.05}
.ov .meta{font-size:calc(12px*var(--u))}
.ov .big-btns{display:flex;flex-wrap:wrap;gap:10px;margin:calc(18px*var(--u)) 0}
.ov .big-btns .btn{padding:calc(14px*var(--u)) calc(22px*var(--u));font-size:calc(15px*var(--u));border-radius:12px}
.ov .big-btns .btn.f{box-shadow:var(--card-glow)}
.ov .slots{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ov .slots .slot{flex-direction:column;align-items:flex-start;width:calc(140px*var(--u));padding:10px;font-size:calc(12px*var(--u))}
.ov .slots .slot .sh{width:100%;height:calc(60px*var(--u))}
.ov .desc{color:var(--muted);font-size:calc(14px*var(--u));line-height:1.55;margin-top:14px;max-width:560px}
@media (max-width:760px){ .ov .box{grid-template-columns:1fr} .ov .box img.big,.ov .noart{aspect-ratio:16/7;object-position:top} }

/* ---------- drop overlay ---------- */
.drop{position:fixed;inset:16px;border:3px dashed var(--accent);border-radius:20px;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50;font-size:28px;font-weight:800;text-align:center;line-height:1.3;padding:20px}
.drop small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:8px}
body.dragging .drop{display:grid}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast b{color:var(--accent)}
</style>
</head>
<body data-mode="desktop" data-theme="slate" data-ui="desk">

<div class="top">
  <div class="wordmark">REP<b>RO</b></div>
  <div class="seg" id="modeSeg">
    <button data-m="desktop" class="on">Desktop</button>
    <button data-m="couch">Couch</button>
  </div>
  <div class="seg ui" id="uiSeg">
    <button data-u="desk" class="on">Desk</button>
    <button data-u="tv">TV</button>
  </div>
  <label class="search">⌕ <input id="q" placeholder="search 22 games…"><kbd>/</kbd></label>
  <div class="spacer"></div>
  <div class="themes"><span>theme</span>
    <button class="swatch on" data-t="slate" style="background:#1b1f2a" title="slate"></button>
    <button class="swatch" data-t="crt" style="background:#39ff6a" title="crt"></button>
    <button class="swatch" data-t="paper" style="background:#fffdf7" title="paper"></button>
  </div>
  <button class="icon" title="add anything" onclick="toast('drop an exe, rom, folder or bios anywhere. or click <b>+</b> and browse.')">+</button>
  <button class="icon" title="settings">⚙</button>
</div>

<!-- ================= DESKTOP ================= -->
<div class="desk">
  <nav class="side" id="side"></nav>
  <section class="main">
    <h2 id="title">All games</h2>
    <div class="sub" id="sub"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="detail" id="detail"><div class="empty">pick a game</div></aside>
</div>

<!-- ================= COUCH ================= -->
<div class="couch" id="couch">
  <div class="bgart" id="bgA"></div><div class="bgart" id="bgB"></div>
  <div class="fade"></div>
  <div class="hero" id="hero"></div>
  <div class="rows" id="rows"><div class="inner" id="inner"></div></div>
  <div class="hud">
    <span><span class="b">A</span>play</span>
    <span><span class="b">Y</span>saves</span>
    <span><span class="b">X</span>random</span>
    <span><span class="b">▤</span>desktop</span>
    <span class="now" id="clock"></span>
  </div>
</div>

<div class="ov" id="ov"></div>
<div class="drop">drop it here<small>exe · rom · folder · bios · anything. REPRO figures out what it is.</small></div>
<div class="toast" id="toast"></div>

<script>
const ART='../art/';
const G=[
 {id:1,t:'Super Mario Strikers',sys:'gc',art:'G4QE01.png',pt:'6h 20m',last:'yesterday',fav:1,y:2005,emu:'Dolphin',file:'Super Mario Strikers (USA).nkit.iso',desc:'Five-a-side soccer with no rules, no fouls and electric fences. Mario, Peach and the rest tackle, item-spam and slam Super Strikes for two goals a shot.'},

 {id:3,t:'Mario Golf: Toadstool Tour',sys:'gc',art:'GFTE01.png',pt:'2h 40m',last:'last week',y:2003,emu:'Dolphin',file:'Mario Golf - Toadstool Tour (USA).ciso',desc:'Arcade golf with a proper swing meter, Mushroom Kingdom courses and enough unlockables to keep a save file busy for months.'},

const SYS={gc:{n:'GameCube',emu:'Dolphin',st:'ok',ico:'GC'},ps2:{n:'PlayStation 2',emu:'PCSX2',st:'ok',ico:'PS2'},ps1:{n:'PlayStation',emu:'DuckStation',st:'ok',ico:'PS1'},xbox:{n:'Xbox',emu:'xemu',st:'ok',ico:'XB'},x360:{n:'Xbox 360',emu:'xenia',st:'warn',ico:'360'},pc:{n:'PC',emu:'—',st:'ok',ico:'PC'}};
const SLOTS={
 default:[{n:'Auto (before last launch)',d:'today 14:02',auto:1},{n:'slot 1',d:'aug 30 · 22:10'},{n:'before boss',d:'aug 28 · 19:41'}],
 14:[{n:'Auto (before last launch)',d:'jul 1 · 20:15',auto:1},{n:'SLUS-00594_1.sav',d:'jul 1 · 20:10'},{n:'resume',d:'jul 1 · 20:14'}],
 16:[{n:'Auto (before last launch)',d:'aug 4 · 23:30',auto:1},{n:'SLPS-02100_1.sav',d:'aug 4 · 23:29'}],
};
let filter='all', sel=null, focus=0, couchList=[], rowsMeta=[];

const body=document.body, $=s=>document.querySelector(s);
const unsorted=['Mario Golf - Toadstool Tour (USA).7z','Fullmetal Alchemist and the Broken Angel (USA, Canada).7z','JSRF - Jet Set Radio Future (USA).xiso.iso'];

function artEl(g){ return g.art?`<img src="${ART+g.art}" alt="">`:`<div class="noart">${g.t}<small>${SYS[g.sys].n} · no art yet</small></div>`; }

/* ---------- desktop ---------- */
function renderSide(){
  const counts={}; G.forEach(g=>counts[g.sys]=(counts[g.sys]||0)+1);
  const B=(f,ico,txt,n,dot)=>`<button data-f="${f}" class="${filter==f?'on':''}"><span class="ico">${ico}</span>${dot?`<span class="dot ${dot}"></span>`:''}<span class="txt">${txt}</span><span class="n">${n}</span></button>`;
  let h=`<h4>Library</h4>${B('all','▦','All games',G.length)}${B('recent','▶','Continue',5)}${B('fav','★','Favorites',G.filter(g=>g.fav).length)}<h4>Systems</h4>`;
  for(const k in SYS) h+=B(k,SYS[k].ico,SYS[k].n,counts[k]||0,SYS[k].st);
  h+=`<h4>Needs you</h4>${B('unsorted','?','Unsorted',unsorted.length,'warn')}${B('bios','B','Bios check',1,'warn')}
  <h4>Collections</h4><button><span class="ico">FB</span><span class="txt">Football</span><span class="n">4</span></button><button><span class="ico">✓</span><span class="txt">Beat it</span><span class="n">2</span></button><button style="color:var(--accent)"><span class="ico">+</span><span class="txt">+ new collection</span></button>`;
  $('#side').innerHTML=h;
  $('#side').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderSide();renderGrid();});
}
function list(){
  const q=($('#q').value||'').toLowerCase();
  let l=G.filter(g=>!q||g.t.toLowerCase().includes(q));
  if(filter=='fav') l=l.filter(g=>g.fav);
  else if(filter=='recent') l=l.filter(g=>g.pt!='—').slice(0,5);
  else if(SYS[filter]) l=l.filter(g=>g.sys==filter);
  return l;
}
function renderGrid(){
  const names={all:'All games',fav:'Favorites',recent:'Continue',unsorted:'Unsorted',bios:'Bios check'};
  $('#title').textContent=names[filter]||SYS[filter].n;
  if(filter=='unsorted'){
    $('#sub').textContent='found these but not sure what they are. tell me and they become cards.';
    $('#grid').style.display='block';
    $('#grid').innerHTML=unsorted.map(u=>`<div class="slot"><div class="sh" style="background:var(--bg)"></div><div class="t">${u}<small>looks like a duplicate of a game already in the library</small></div><div class="act" style="opacity:1"><button onclick="toast('hidden. it stays on disk, REPRO just stops asking.')">hide</button><button>assign system…</button><button>delete file</button></div></div>`).join('');
    return;
  }
  if(filter=='bios'){
    $('#sub').textContent='what each emulator wants, and whether it has it.';
    $('#grid').style.display='block';
    $('#grid').innerHTML=`
    <div class="slot"><div class="sh" style="background:#3ddc84"></div><div class="t">PlayStation 2 <small>ps2-0230a-20080220.bin · usa v2.30 · ok</small></div></div>
    <div class="slot"><div class="sh" style="background:#3ddc84"></div><div class="t">PlayStation <small>scph1001.bin + 15 others · ok</small></div></div>
    <div class="slot"><div class="sh" style="background:#3ddc84"></div><div class="t">Xbox <small>mcpx_1.0.bin, xbox-5713.bin, eeprom.bin, xbox_hdd.qcow2 · ok</small></div></div>
    <div class="slot"><div class="sh" style="background:var(--accent2)"></div><div class="t">Xbox 360 <small>xbox360-bios-v10.bin present but xenia doesn't use a bios file. nothing to fix, just fyi.</small></div><div class="act" style="opacity:1"><button>open folder</button></div></div>`;
    return;
  }
  const l=list();
  $('#grid').style.display='grid';
  $('#sub').textContent=`${l.length} games · ${filter=='all'?'4 emulators':SYS[filter]?SYS[filter].emu:''}`;
  $('#grid').innerHTML=l.map(g=>`<div class="card ${sel==g.id?'sel':''}" data-id="${g.id}">${artEl(g)}<span class="tag">${g.sys.toUpperCase()}</span>${g.fav?'<span class="fav">★</span>':''}${g.pt!='—'?`<span class="pt">${g.pt}</span>`:''}</div>`).join('');
  $('#grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>{sel=+c.dataset.id;renderGrid();renderDetail();$('#detail').classList.add('open');});
}
function renderDetail(){
  const g=G.find(x=>x.id==sel); if(!g){$('#detail').innerHTML='<div class="empty">pick a game</div>';return;}
  const s=SYS[g.sys], slots=SLOTS[g.id]||SLOTS.default;
  $('#detail').innerHTML=`
  <button class="icon close" onclick="$('#detail').classList.remove('open')">✕</button>
  <div class="hero">${g.art?`<img src="${ART+g.art}">`:''}<div class="cover">${artEl(g)}</div></div>
  <div class="body">
    <h3>${g.t}</h3>
    <div class="meta"><span>${s.n}</span><span>${g.y}</span><span>${g.pt} played</span><span>last: ${g.last}</span>${g.discs?`<span>${g.discs} discs</span>`:''}</div>
    <button class="btn primary" onclick="launch(${g.id})">▶ Play</button>
    <div class="row"><button class="btn" onclick="toast('${g.fav?'removed from':'added to'} favorites')">★ ${g.fav?'Unfavorite':'Favorite'}</button><button class="btn">✎ Edit</button><button class="btn" onclick="toast('opening ${g.file}')">▣ Folder</button></div>
    <div class="sect"><h5>Saves <a onclick="toast('snapshot taken: <b>slot ${slots.length}</b>')">+ snapshot now</a></h5>
      ${slots.map(x=>`<div class="slot ${x.auto?'auto':''}"><div class="sh"></div><div class="t">${x.n}<small>${x.d}</small></div><div class="act"><button onclick="toast('restored <b>${x.n}</b>. previous state backed up first.')">restore</button><button>rename</button><button>⋯</button></div></div>`).join('')}
    </div>
    <div class="sect"><h5>Launch</h5>
      <div class="kv">
        <span>emulator</span><select><option>${s.emu} (system default)</option><option>RetroArch · ${g.sys} core</option><option>custom…</option></select>
        <span>args</span><code>-fullscreen -batch "{rom}"</code>
        <span>saves from</span><code>${g.sys=='xbox'?'xbox_hdd.qcow2 (snapshot)':g.sys=='gc'?'GC/USA/Card A':g.sys=='ps1'?'memcards/'+(g.serial||'…')+'.mcd':'memcards/'+g.t.slice(0,12)+'….ps2'}</code>
        <span>rom</span><code title="${g.file}">${g.file}</code>
      </div>
    </div>
  </div>`;
}

/* ---------- couch ---------- */
function renderCouch(){
  const cont=G.filter(g=>g.pt!='—').slice(0,6);
  const rows=[{k:'continue',n:'Continue',items:cont}];
  for(const k in SYS){ const it=G.filter(g=>g.sys==k); if(it.length) rows.push({k,n:SYS[k].n,items:it}); }
  couchList=[]; rowsMeta=[];
  $('#inner').innerHTML=rows.map((r,ri)=>`<div class="crow" data-ri="${ri}"><h3><b>${r.n}</b> ${r.items.length}</h3><div class="strip">${r.items.map(g=>{couchList.push(g.id);rowsMeta.push(ri);return `<div class="tile" data-id="${g.id}">${artEl(g)}${g.pt!='—'?`<div class="prog"><i style="width:${20+(g.id*13)%70}%"></i></div>`:''}</div>`;}).join('')}${r.k=='pc'?'<div class="tile add">+</div>':''}</div></div>`).join('');
  $('#rows').querySelectorAll('.tile[data-id]').forEach((t,i)=>{t.onmouseenter=()=>setFocus(i);t.onclick=()=>{ if(focus==i) openOv(); else setFocus(i); };});
  setFocus(focus,true);
}
let bgFlip=false;
function setFocus(i,instant){
  const tiles=[...$('#rows').querySelectorAll('.tile[data-id]')]; if(!tiles.length)return;
  focus=Math.max(0,Math.min(tiles.length-1,i));
  tiles.forEach(t=>t.classList.remove('focus')); const t=tiles[focus]; t.classList.add('focus');
  const ri=rowsMeta[focus], crows=[...$('#rows').querySelectorAll('.crow')];
  // vertical: slide the rows container so the focused row sits at the top
  const inner=$('#inner'), padTop=parseFloat(getComputedStyle(inner).paddingTop);
  inner.style.transform=`translateY(-${crows[ri].offsetTop-padTop}px)`;
  crows.forEach((c,k)=>{c.classList.toggle('dim',k>ri);c.classList.toggle('gone',k<ri);});
  // horizontal: slide only this row's strip so the focused tile is the leftmost
  const strip=t.parentElement, pad=parseFloat(getComputedStyle(strip).paddingLeft);
  const maxX=Math.max(0,strip.scrollWidth-$('#rows').clientWidth);
  strip.style.transform=`translateX(-${Math.min(maxX,Math.max(0,t.offsetLeft-pad-t.offsetWidth*0.07))}px)`;
  // hero + background
  const g=G.find(x=>x.id==couchList[focus]);
  const h=$('#hero'); h.classList.remove('swap'); void h.offsetWidth; h.classList.add('swap');
  h.innerHTML=`<div class="sys">${SYS[g.sys].n} · ${SYS[g.sys].emu}</div><h1>${g.t}</h1><div class="meta"><span>${g.y}</span><span>${g.pt} played</span><span>last: ${g.last}</span></div><div class="desc">${g.desc||''}</div><div class="hint"><span class="p">▶ Play</span><span>saves</span><span>★</span></div>`;
  const a=$('#bgA'), b=$('#bgB'), nxt=bgFlip?a:b, cur=bgFlip?b:a; bgFlip=!bgFlip;
  nxt.style.backgroundImage=g.art?`url("${ART+g.art}")`:'none';
  nxt.classList.add('on'); cur.classList.remove('on');
}
function openOv(){
  const g=G.find(x=>x.id==couchList[focus]); const slots=SLOTS[g.id]||SLOTS.default;
  $('#ov').innerHTML=`<div class="box">${g.art?`<img class="big" src="${ART+g.art}">`:`<div class="noart">no art yet</div>`}
   <div class="body"><h2>${g.t}</h2><div class="meta"><span>${SYS[g.sys].n}</span><span>${g.y}</span><span>${g.pt} played</span><span>${SYS[g.sys].emu}</span></div>
   <div class="big-btns"><button class="btn primary f" style="width:auto" onclick="launch(${g.id})">▶ Play</button><button class="btn">★</button><button class="btn">saves</button><button class="btn">details</button></div>
   <div class="sect"><h5>Saves</h5><div class="slots">${slots.map(x=>`<div class="slot ${x.auto?'auto':''}"><div class="sh"></div><div class="t">${x.n}<small>${x.d}</small></div></div>`).join('')}</div></div>
   <div class="desc">${g.desc||''}</div>
   </div></div>`;
  $('#ov').classList.add('open');
}
function launch(id){ const g=G.find(x=>x.id==id); $('#ov').classList.remove('open'); toast(`launching <b>${g.t}</b> with ${SYS[g.sys].emu}. auto save snapshot taken first. hub sleeps until it exits.`); }

/* ---------- glue ---------- */
function setMode(m){ body.dataset.mode=m; $('#modeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m==m)); if(m=='couch') renderCouch(); }
function setUI(u){ body.dataset.ui=u; $('#uiSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.u==u)); if(body.dataset.mode=='couch') requestAnimationFrame(()=>setFocus(focus)); }
$('#modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('#uiSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>setUI(b.dataset.u));
document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{body.dataset.theme=s.dataset.t;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on',x==s));});
$('#q').oninput=()=>renderGrid();
let tt; function toast(h){ const t=$('#toast'); t.innerHTML=h; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }
window.addEventListener('resize',()=>{ if(body.dataset.mode=='couch') setFocus(focus); });
document.addEventListener('keydown',e=>{
  if(e.target.tagName=='INPUT'){ if(e.key=='Escape') e.target.blur(); return; }
  if(e.key=='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key=='Tab'){ e.preventDefault(); setMode(body.dataset.mode=='couch'?'desktop':'couch'); return; }
  if(body.dataset.mode!='couch'){ if(e.key=='Escape') $('#detail').classList.remove('open'); return; }
  if($('#ov').classList.contains('open')){ if(e.key=='Escape'||e.key=='Backspace') $('#ov').classList.remove('open'); if(e.key=='Enter') launch(couchList[focus]); return; }
  const n=couchList.length, ri=rowsMeta[focus];
  const rowStart=r=>rowsMeta.indexOf(r), rowLen=r=>rowsMeta.filter(x=>x==r).length;
  if(e.key=='ArrowRight'&&rowsMeta[focus+1]==ri) setFocus(focus+1);
  if(e.key=='ArrowLeft'&&rowsMeta[focus-1]==ri) setFocus(focus-1);
  if(e.key=='ArrowDown'||e.key=='ArrowUp'){
    const r2=ri+(e.key=='ArrowDown'?1:-1); if(rowStart(r2)<0) return;
    const col=focus-rowStart(ri); setFocus(rowStart(r2)+Math.min(col,rowLen(r2)-1));
  }
  if(e.key=='Enter') openOv();
  if(e.key.toLowerCase()=='x') setFocus(Math.floor(Math.random()*n));
  if(e.key.toLowerCase()=='t') setUI(body.dataset.ui=='tv'?'desk':'tv');
});
$('#ov').onclick=e=>{ if(e.target.id=='ov') $('#ov').classList.remove('open'); };
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();body.classList.add('dragging');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev=='drop'||e.relatedTarget==null)body.classList.remove('dragging');if(ev=='drop')toast('got it. looks like a <b>DuckStation</b> exe, ps1. want the default args?');}));
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);

renderSide(); renderGrid(); sel=11; renderGrid(); renderDetail();
const P=new URLSearchParams(location.search);
if(P.get('theme')){ body.dataset.theme=P.get('theme'); document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on',x.dataset.t==P.get('theme'))); }
if(P.get('ui')) setUI(P.get('ui'));
if(P.get('mode')=='couch'){ setMode('couch'); focus=+(P.get('focus')||1); setFocus(focus,true); if(P.get('ov')) openOv(); }
</script>
